name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: HumDrop-macOS
          - os: windows-latest
            name: Windows
            artifact: HumDrop-Windows
          - os: ubuntu-latest
            name: Linux
            artifact: HumDrop-Linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install customtkinter pyinstaller Pillow

      - name: Generate icons (macOS)
        if: runner.os == 'macOS'
        working-directory: cross-platform
        run: python generate_icons.py

      - name: Generate icons (non-macOS)
        if: runner.os != 'macOS'
        working-directory: cross-platform
        run: python generate_icons.py
        continue-on-error: true

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: cross-platform
        run: |
          pyinstaller --onedir --windowed \
            --name "HumDrop" \
            --icon "HumDrop.icns" \
            --osx-bundle-identifier "com.fe2o3.humdrop" \
            --collect-all customtkinter \
            humdrop.py
          # Patch Info.plist with folder permission descriptions
          PLIST="dist/HumDrop.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSDesktopFolderUsageDescription string 'HumDrop saves downloaded camera files to your Desktop folder.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSDocumentsFolderUsageDescription string 'HumDrop saves downloaded camera files to your Documents folder.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSDownloadsFolderUsageDescription string 'HumDrop saves downloaded camera files to your Downloads folder.'" "$PLIST" 2>/dev/null || true

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: cross-platform
        shell: pwsh
        run: |
          pyinstaller --onedir --windowed `
            --name "HumDrop" `
            --collect-all customtkinter `
            humdrop.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: cross-platform
        run: |
          pyinstaller --onedir --windowed \
            --name "HumDrop" \
            --collect-all customtkinter \
            humdrop.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: cross-platform
        run: |
          cd dist
          zip -r ../HumDrop-macOS.zip HumDrop.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: cross-platform
        shell: pwsh
        run: |
          Compress-Archive -Path dist\HumDrop\* -DestinationPath HumDrop-Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: cross-platform
        run: |
          cd dist
          tar -czf ../HumDrop-Linux.tar.gz HumDrop/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            cross-platform/HumDrop-macOS.zip
            cross-platform/HumDrop-Windows.zip
            cross-platform/HumDrop-Linux.tar.gz

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cross-platform/HumDrop-macOS.zip
            cross-platform/HumDrop-Windows.zip
            cross-platform/HumDrop-Linux.tar.gz
